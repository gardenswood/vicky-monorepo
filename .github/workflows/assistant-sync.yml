name: Assistant Sync

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Firestore assistant_runs id
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Redeploy bot after assistant change
        working-directory: apps/bot
        run: gcloud builds submit --config=cloudbuild.yaml --project=webgardens-8655d
