name: Deploy Firestore Rules And Indexes

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/dashboard/firestore.rules'
      - 'apps/dashboard/firestore.indexes.json'
      - 'apps/bot/firebase/firestore.rules'
      - 'apps/bot/firebase/firestore.indexes.json'
      - '.github/workflows/deploy-firestore.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Firestore from dashboard source
        working-directory: apps/dashboard
        run: npx -y firebase-tools@latest deploy --only firestore --project webgardens-8655d
